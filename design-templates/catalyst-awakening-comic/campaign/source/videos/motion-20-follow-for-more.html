<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../pipeline/base.css"><link rel="stylesheet" href="../pipeline/motion.css">
<style>
  body { background: #06060d; }
  .mark { position: absolute; top: 260px; left: 50%; transform: translateX(-50%); width: 220px; height: 220px; border-radius: 999px; border: 6px solid var(--gold); display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue'; font-size: 100px; color: var(--gold); }
  .handle { position: absolute; top: 560px; left: 0; right: 0; text-align: center; font-family: 'Bebas Neue'; font-size: 130px; color: var(--bone); letter-spacing: 4px; }
  .plat-row { position: absolute; top: 760px; left: 0; right: 0; display: flex; justify-content: center; gap: 40px; }
  .plat { font-family: 'Oswald'; font-weight: 700; font-size: 32px; letter-spacing: 6px; color: var(--ash); padding: 16px 30px; border: 2px solid var(--iron); border-radius: 999px; }
  .cta { position: absolute; top: 1000px; left: 0; right: 0; text-align: center; font-family: 'Bebas Neue'; font-size: 90px; color: var(--gold); }
</style></head><body><div class="stage" id="cam">
  <div class="mark" id="mark">C:TA</div>
  <div class="handle" id="handle">@CATALYSTCOMICSHQ</div>
  <div class="plat-row" id="plats">
    <span class="plat" id="pl1">TIKTOK</span>
    <span class="plat" id="pl2">IG</span>
    <span class="plat" id="pl3">YOUTUBE</span>
  </div>
  <div class="cta" id="cta">NEW ISSUES WEEKLY ↗</div>
  <div class="brandmark">CATALYST · <b>THE AWAKENING</b><div class="sitemark">CATALYST-AWAKENING.NETLIFY.APP</div></div>
  <div class="grain"></div><div class="vignette"></div>
</div>
<script src="../pipeline/kinetic.js"></script><script src="../pipeline/kit.js"></script><script src="../pipeline/motion-common.js"></script>
<script>
const $ = id => document.getElementById(id);
KIN.add($('mark'), {t0:0, t1:600, from:{opacity:0, scale:0.4, rot:-30}, to:{opacity:1, scale:1, rot:0}, ease:'outBack'});
KIT.charCascade($('handle'), 700, 44, 340);
['pl1','pl2','pl3'].forEach((id,i)=>{
  const t = 1700 + i*160;
  KIN.add($(id), {t0:t, t1:t+340, from:{opacity:0, y:30}, to:{opacity:1, y:0}, ease:'outQuart'});
});
KIT.slam($('cta'), 2500, {from: 1.6, dur: 400});
KIT.drift($('cam'), 0, 7000, 1, 1.03);
brandmark(5000, 7000);
KIN.seek(0);
</script></body></html>
