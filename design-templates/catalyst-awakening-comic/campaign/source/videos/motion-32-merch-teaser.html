<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../pipeline/base.css"><link rel="stylesheet" href="../pipeline/motion.css">
<style>
  body { background: #06060d; }
  .tee { position: absolute; top: 300px; left: 50%; transform: translateX(-50%); width: 480px; height: 560px; background: #111; border-radius: 20px; display: flex; align-items: center; justify-content: center; }
  .tee-logo { font-family: 'Bebas Neue'; font-size: 100px; color: var(--gold); text-align: center; line-height: 0.9; }
  .tee-logo span { display: block; font-family: 'Oswald'; font-weight: 600; font-size: 26px; color: var(--bone); letter-spacing: 10px; margin-top: 10px; }
  .title { position: absolute; top: 900px; left: 0; right: 0; text-align: center; font-family: 'Bebas Neue'; font-size: 110px; color: var(--bone); }
  .sub { position: absolute; top: 1040px; left: 0; right: 0; text-align: center; font-family: 'Oswald'; font-weight: 700; font-size: 34px; letter-spacing: 8px; color: var(--gold); }
</style></head><body><div class="stage" id="cam">
  <div class="tee" id="tee"><div class="tee-logo">CATALYST<span>THE AWAKENING</span></div></div>
  <div class="title" id="title">MERCH DROPS SOON.</div>
  <div class="sub" id="sub">◈ FIRST 100 GET FREE SHIPPING ◈</div>
  <div class="brandmark">CATALYST · <b>THE AWAKENING</b><div class="sitemark">CATALYST-AWAKENING.NETLIFY.APP</div></div>
  <div class="grain"></div><div class="vignette"></div>
</div>
<script src="../pipeline/kinetic.js"></script><script src="../pipeline/kit.js"></script><script src="../pipeline/motion-common.js"></script>
<script>
const $ = id => document.getElementById(id);
KIN.add($('tee'), {t0:0, t1:700, from:{opacity:0, scale:0.7, rot:-6}, to:{opacity:1, scale:1, rot:0}, ease:'outBack'});
KIT.shake($('tee'), 720, 260, 8);
KIT.charCascade($('title'), 1400, 32, 320);
KIN.add($('sub'), {t0:2200, t1:2700, from:{opacity:0, ls:30}, to:{opacity:1, ls:8}, ease:'outExpo'});
KIT.drift($('cam'), 0, 7000, 1, 1.02);
brandmark(5000, 7000);
KIN.seek(0);
</script></body></html>
