<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../pipeline/base.css"><link rel="stylesheet" href="../pipeline/motion.css">
<style>
  body { background: #06060d; }
  .num { position: absolute; top: 320px; left: 0; right: 0; text-align: center; font-family: 'Bebas Neue'; font-size: 260px; color: var(--gold); line-height: 0.85; }
  .lab { position: absolute; top: 620px; left: 0; right: 0; text-align: center; font-family: 'Oswald'; font-weight: 700; font-size: 42px; letter-spacing: 10px; color: var(--bone); }
  .msg { position: absolute; top: 800px; left: 100px; right: 100px; text-align: center; font-family: 'Crimson Pro'; font-style: italic; font-size: 46px; color: var(--ash); line-height: 1.3; }
</style></head><body><div class="stage" id="cam">
  <div class="corner-tl"></div><div class="corner-tr"></div><div class="corner-bl"></div><div class="corner-br"></div>
  <div class="num" id="num">50,000+</div>
  <div class="lab" id="lab">READERS AND COUNTING</div>
  <div class="msg" id="msg">Every page you read<br>keeps Lagos <em style="color:var(--gold);font-style:italic">alive</em>. Thank you.</div>
  <div class="brandmark">CATALYST · <b>THE AWAKENING</b><div class="sitemark">CATALYST-AWAKENING.NETLIFY.APP</div></div>
  <div class="grain"></div><div class="vignette"></div>
</div>
<script src="../pipeline/kinetic.js"></script><script src="../pipeline/kit.js"></script><script src="../pipeline/motion-common.js"></script>
<script>
const $ = id => document.getElementById(id);
cornerFrame(150, 700);
KIT.slam($('num'), 200, {from: 2.4, dur: 420});
KIN.add($('lab'), {t0:900, t1:1400, from:{opacity:0, ls:30}, to:{opacity:1, ls:10}, ease:'outExpo'});
KIT.linePop($('msg'), 2200, 300, 480);
KIT.drift($('cam'), 0, 7500, 1, 1.03);
brandmark(5300, 7500);
KIN.seek(0);
</script></body></html>
