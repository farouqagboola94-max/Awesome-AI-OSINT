<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../pipeline/base.css"><link rel="stylesheet" href="../pipeline/motion.css">
<style>
  body { background: #06060d; }
  .title { position: absolute; top: 180px; left: 0; right: 0; text-align: center; font-family: 'Bebas Neue'; font-size: 110px; color: var(--gold); letter-spacing: 4px; }
  .pin-row { position: absolute; left: 100px; right: 100px; display: flex; align-items: center; gap: 24px; }
  .p1 { top: 400px; } .p2 { top: 520px; } .p3 { top: 640px; } .p4 { top: 760px; } .p5 { top: 880px; } .p6 { top: 1000px; }
  .pin { width: 24px; height: 24px; border-radius: 999px 999px 999px 0; transform: rotate(45deg); flex-shrink: 0; }
  .ploc { font-family: 'Oswald'; font-weight: 700; font-size: 40px; letter-spacing: 4px; color: var(--bone); }
  .pwho { font-family: 'Space Grotesk'; font-size: 24px; letter-spacing: 3px; color: var(--ash); margin-left: 12px; }
</style></head><body><div class="stage" id="cam">
  <div class="gridbg"></div>
  <div class="corner-tl"></div><div class="corner-tr"></div><div class="corner-bl"></div><div class="corner-br"></div>
  <div class="title" id="title">THE MAP.</div>
  <div class="pin-row p1" id="r1"><div class="pin" style="background:var(--gold)"></div><span class="ploc">MUSHIN<span class="pwho">— BAYO</span></span></div>
  <div class="pin-row p2" id="r2"><div class="pin" style="background:var(--teal)"></div><span class="ploc">IKEJA<span class="pwho">— AMARA</span></span></div>
  <div class="pin-row p3" id="r3"><div class="pin" style="background:var(--orange)"></div><span class="ploc">AJEGUNLE<span class="pwho">— IKENNA</span></span></div>
  <div class="pin-row p4" id="r4"><div class="pin" style="background:var(--red)"></div><span class="ploc">APAPA<span class="pwho">— ZARA</span></span></div>
  <div class="pin-row p5" id="r5"><div class="pin" style="background:var(--indigo)"></div><span class="ploc">YABA<span class="pwho">— WIRE</span></span></div>
  <div class="pin-row p6" id="r6"><div class="pin" style="background:#7A0E20"></div><span class="ploc">VICTORIA ISLAND<span class="pwho">— KALU</span></span></div>
  <div class="brandmark">CATALYST · <b>THE AWAKENING</b><div class="sitemark">CATALYST-AWAKENING.NETLIFY.APP</div></div>
  <div class="grain"></div><div class="vignette"></div>
</div>
<script src="../pipeline/kinetic.js"></script><script src="../pipeline/kit.js"></script><script src="../pipeline/motion-common.js"></script>
<script>
const $ = id => document.getElementById(id);
cornerFrame(140, 700);
KIT.charCascade($('title'), 300, 30, 300);
['r1','r2','r3','r4','r5','r6'].forEach((id,i)=>{
  const t = 900 + i*230;
  KIN.add($(id), {t0:t, t1:t+380, from:{opacity:0, x:-70}, to:{opacity:1, x:0}, ease:'outQuart'});
});
KIT.drift($('cam'), 0, 8000, 1, 1.03);
brandmark(5800, 8000);
KIN.seek(0);
</script></body></html>
