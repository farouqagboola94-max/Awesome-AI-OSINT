<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../pipeline/base.css"><link rel="stylesheet" href="../pipeline/motion.css">
<style>
  body { background: #06060d; }
  .phone { position: absolute; top: 300px; left: 50%; transform: translateX(-50%); width: 480px; height: 900px; border: 8px solid var(--iron); border-radius: 60px; background: var(--navy); overflow: hidden; }
  .phone-title { position: absolute; top: 60px; left: 0; right: 0; text-align: center; font-family: 'Bebas Neue'; font-size: 70px; color: var(--gold); }
  .phone-lock { position: absolute; top: 220px; left: 50%; transform: translateX(-50%); width: 120px; height: 120px; border: 6px solid var(--gold); border-radius: 999px; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue'; font-size: 60px; color: var(--gold); }
  .ripple { position: absolute; top: 220px; left: 50%; transform: translateX(-50%); width: 120px; height: 120px; border: 4px solid var(--gold); border-radius: 999px; opacity: 0; }
  .phone-cap { position: absolute; top: 420px; left: 0; right: 0; text-align: center; font-family: 'Oswald'; font-weight: 600; font-size: 28px; letter-spacing: 6px; color: var(--ash); }
  .tapfx { position: absolute; top: 220px; left: 50%; transform: translateX(-50%); width: 40px; height: 40px; border-radius: 999px; background: var(--bone); opacity: 0; }
  .headline { position: absolute; top: 1300px; left: 0; right: 0; text-align: center; font-family: 'Bebas Neue'; font-size: 150px; color: var(--bone); line-height: 0.9; }
  .headline span { color: var(--gold); }
</style></head><body><div class="stage" id="cam">
  <div class="phone">
    <div class="phone-title" id="pt">CATALYST</div>
    <div class="ripple" id="rip"></div>
    <div class="phone-lock" id="lock">🔓</div>
    <div class="tapfx" id="tap"></div>
    <div class="phone-cap" id="pc">TAP TO UNLOCK</div>
  </div>
  <div class="headline" id="hl">FREE.<br><span>NO CATCH.</span></div>
  <div class="brandmark">CATALYST · <b>THE AWAKENING</b><div class="sitemark">CATALYST-AWAKENING.NETLIFY.APP</div></div>
  <div class="grain"></div><div class="vignette"></div>
</div>
<script src="../pipeline/kinetic.js"></script><script src="../pipeline/kit.js"></script><script src="../pipeline/motion-common.js"></script>
<script>
const $ = id => document.getElementById(id);
KIN.add($('pt'), {t0:0, t1:500, from:{opacity:0, y:-20}, to:{opacity:1, y:0}, ease:'outExpo'});
KIN.add($('lock'), {t0:300, t1:800, from:{opacity:0, scale:0.4}, to:{opacity:1, scale:1}, ease:'outBack'});
KIN.add($('pc'), {t0:700, t1:1100, from:{opacity:0}, to:{opacity:1}, ease:'outQuart'});
// tap animation loop-ish single event
KIN.add($('tap'), {t0:1600, t1:1750, from:{opacity:0.9, scale:0.3}, to:{opacity:0, scale:2.2}, ease:'outExpo'});
KIN.add($('rip'), {t0:1600, t1:2100, from:{opacity:0.8, scale:1}, to:{opacity:0, scale:2.6}, ease:'outExpo'});
KIT.slam($('lock'), 1750, {from: 1, dur: 240, ease:'outBack'});
KIN.fx($('lock'), 1750, 1900, (p,t)=>{ $('lock').textContent = p > 0.5 ? '🔓' : '🔒'; });
KIT.linePop($('hl'), 2200, 280, 480);
KIT.drift($('cam'), 0, 7000, 1, 1.02);
brandmark(5000, 7000);
KIN.seek(0);
</script></body></html>
