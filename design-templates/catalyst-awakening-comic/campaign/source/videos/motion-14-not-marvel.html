<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../pipeline/base.css"><link rel="stylesheet" href="../pipeline/motion.css">
<style>
  body { background: #06060d; }
  .row { position: absolute; left: 80px; right: 80px; display: flex; align-items: center; justify-content: space-between; font-family: 'Oswald'; font-weight: 600; letter-spacing: 4px; padding: 24px 0; border-bottom: 2px solid var(--iron); }
  .r1 { top: 480px; } .r2 { top: 600px; } .r3 { top: 720px; } .r4 { top: 840px; }
  .row .l { font-size: 32px; color: var(--ash); }
  .row .r { font-size: 32px; color: var(--gold); text-align: right; }
  .title { position: absolute; top: 220px; left: 0; right: 0; text-align: center; font-family: 'Bebas Neue'; font-size: 130px; color: var(--bone); letter-spacing: 4px; }
  .title span { color: var(--gold); }
  .foot { position: absolute; top: 1000px; left: 0; right: 0; text-align: center; font-family: 'Oswald'; font-weight: 300; font-size: 36px; letter-spacing: 12px; color: var(--ash); }
</style></head><body><div class="stage" id="cam">
  <div class="corner-tl"></div><div class="corner-tr"></div><div class="corner-bl"></div><div class="corner-br"></div>
  <div class="title" id="title">THIS ISN'T <span>MARVEL.</span></div>
  <div class="row r1" id="row1"><span class="l">NORSE GODS</span><span class="r">→ YORUBA ORISHAS</span></div>
  <div class="row r2" id="row2"><span class="l">NEW YORK</span><span class="r">→ LAGOS</span></div>
  <div class="row r3" id="row3"><span class="l">BILLIONAIRE HERO</span><span class="r">→ 19-YEAR-OLD FROM MUSHIN</span></div>
  <div class="row r4" id="row4"><span class="l">FICTIONAL MYTH</span><span class="r">→ LIVING TRADITION</span></div>
  <div class="foot" id="foot">FREE · ONLINE · MADE IN LAGOS</div>
  <div class="brandmark">CATALYST · <b>THE AWAKENING</b><div class="sitemark">CATALYST-AWAKENING.NETLIFY.APP</div></div>
  <div class="grain"></div><div class="vignette"></div>
</div>
<script src="../pipeline/kinetic.js"></script><script src="../pipeline/kit.js"></script><script src="../pipeline/motion-common.js"></script>
<script>
const $ = id => document.getElementById(id);
cornerFrame(150, 700);
KIT.charCascade($('title'), 300, 30, 300);
['row1','row2','row3','row4'].forEach((id,i)=>{
  const t = 1300 + i*260;
  KIN.add($(id), {t0:t, t1:t+420, from:{opacity:0, x:-60}, to:{opacity:1, x:0}, ease:'outQuart'});
});
KIN.add($('foot'), {t0:2900, t1:3400, from:{opacity:0, ls:36}, to:{opacity:1, ls:12}, ease:'outExpo'});
KIT.drift($('cam'), 0, 7000, 1, 1.03);
brandmark(5000, 7000);
KIN.seek(0);
</script></body></html>
