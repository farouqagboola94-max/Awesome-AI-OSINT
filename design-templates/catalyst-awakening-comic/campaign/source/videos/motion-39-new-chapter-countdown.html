<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../pipeline/base.css"><link rel="stylesheet" href="../pipeline/motion.css">
<style>
  body { background: var(--indigo); }
  .stage { background: linear-gradient(180deg, #1a1a6e, #06060d); }
  .tag { position: absolute; top: 260px; left: 0; right: 0; text-align: center; font-family: 'Oswald'; font-weight: 700; font-size: 30px; letter-spacing: 14px; color: var(--gold); }
  .title { position: absolute; top: 380px; left: 0; right: 0; text-align: center; font-family: 'Bebas Neue'; font-size: 130px; color: var(--bone); }
  .cd { position: absolute; top: 640px; left: 0; right: 0; display: flex; justify-content: center; gap: 60px; }
  .cd-item { text-align: center; }
  .cd-num { font-family: 'Bebas Neue'; font-size: 160px; color: var(--gold); line-height: 1; }
  .cd-lab { font-family: 'Oswald'; font-weight: 300; letter-spacing: 8px; font-size: 26px; color: var(--ash); }
</style></head><body><div class="stage" id="cam">
  <div class="tag" id="tag">◈ NEW CHAPTER IN ◈</div>
  <div class="title" id="title">GET READY.</div>
  <div class="cd">
    <div class="cd-item"><div class="cd-num" id="d1">03</div><div class="cd-lab">DAYS</div></div>
    <div class="cd-item"><div class="cd-num" id="d2">14</div><div class="cd-lab">HRS</div></div>
    <div class="cd-item"><div class="cd-num" id="d3">27</div><div class="cd-lab">MIN</div></div>
  </div>
  <div class="brandmark">CATALYST · <b>THE AWAKENING</b><div class="sitemark">CATALYST-AWAKENING.NETLIFY.APP</div></div>
  <div class="grain"></div><div class="vignette"></div>
</div>
<script src="../pipeline/kinetic.js"></script><script src="../pipeline/kit.js"></script><script src="../pipeline/motion-common.js"></script>
<script>
const $ = id => document.getElementById(id);
KIN.add($('tag'), {t0:0, t1:600, from:{opacity:0, ls:32}, to:{opacity:1, ls:14}, ease:'outExpo'});
KIT.slam($('title'), 700, {from: 2, dur: 380});
['d1','d2','d3'].forEach((id,i)=>{
  const t = 1700+i*180;
  KIN.add($(id), {t0:t, t1:t+380, from:{opacity:0, scale:1.4}, to:{opacity:1, scale:1}, ease:'outBack'});
});
KIT.drift($('cam'), 0, 7500, 1, 1.03);
brandmark(5300, 7500);
KIN.seek(0);
</script></body></html>
