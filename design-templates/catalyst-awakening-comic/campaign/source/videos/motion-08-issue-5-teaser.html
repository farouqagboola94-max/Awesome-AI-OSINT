<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../pipeline/base.css"><link rel="stylesheet" href="../pipeline/motion.css">
<style>
  body { background: linear-gradient(180deg, #0a0a1f, #1a1a6e); }
  .stage { background: linear-gradient(180deg, #0a0a1f, #1a1a6e); }
  .stamp { position: absolute; top: 200px; left: 50%; transform: translateX(-50%); border: 4px solid var(--gold); border-radius: 999px; padding: 12px 44px; font-family: 'Oswald'; font-weight: 700; font-size: 30px; letter-spacing: 10px; color: var(--gold); }
  .issue { position: absolute; top: 340px; left: 0; right: 0; text-align: center; font-family: 'Bebas Neue'; font-size: 500px; color: var(--gold); line-height: 0.85; text-shadow: 0 0 100px rgba(244,184,0,0.45); }
  .subtitle { position: absolute; top: 900px; left: 0; right: 0; text-align: center; font-family: 'Bebas Neue'; font-size: 170px; color: var(--bone); }
  .tag { position: absolute; top: 1120px; left: 0; right: 0; text-align: center; font-family: 'Oswald'; font-weight: 300; letter-spacing: 14px; font-size: 40px; color: var(--ash); }
  .countdown { position: absolute; top: 1260px; left: 0; right: 0; text-align: center; }
  .cd-item { display: inline-block; margin: 0 24px; text-align: center; }
  .cd-num { font-family: 'Bebas Neue'; font-size: 130px; color: var(--gold); line-height: 1; }
  .cd-lab { font-family: 'Oswald'; font-weight: 300; letter-spacing: 6px; font-size: 26px; color: var(--ash); }
</style></head><body><div class="stage" id="cam">
  <div class="stamp" id="stamp">◈ NEXT ISSUE ◈</div>
  <div class="issue" id="issue">05</div>
  <div class="subtitle" id="subtitle">FIRE IN MUSHIN</div>
  <div class="tag" id="tag">DROPS SOON · BE READY</div>
  <div class="countdown">
    <div class="cd-item"><div class="cd-num" id="cd1">14</div><div class="cd-lab">DAYS</div></div>
    <div class="cd-item"><div class="cd-num" id="cd2">08</div><div class="cd-lab">HOURS</div></div>
    <div class="cd-item"><div class="cd-num" id="cd3">42</div><div class="cd-lab">MIN</div></div>
  </div>
  <div class="brandmark">CATALYST · <b>THE AWAKENING</b><div class="sitemark">CATALYST-AWAKENING.NETLIFY.APP</div></div>
  <div class="grain"></div><div class="vignette"></div>
</div>
<script src="../pipeline/kinetic.js"></script><script src="../pipeline/kit.js"></script><script src="../pipeline/motion-common.js"></script>
<script>
const $ = id => document.getElementById(id);
const stamp = document.querySelector('.stamp');
stamp.dataset.kbase = 'translateX(-50%)';
KIN.add(stamp, {t0:100, t1:700, from:{opacity:0, y:-40, ls:20}, to:{opacity:1, y:0, ls:10}, ease:'outExpo'});
KIT.slam($('issue'), 500, {from: 3, dur: 480, ease:'outBackHard'});
KIT.shake($('cam'), 550, 380, 12);
KIN.add($('subtitle'), {t0:1200, t1:1700, from:{opacity:0, y:60, blur:8}, to:{opacity:1, y:0, blur:0}, ease:'outQuart'});
KIN.add($('tag'), {t0:1700, t1:2200, from:{opacity:0, ls:40}, to:{opacity:1, ls:14}, ease:'outExpo'});
// ticking countdown effect: numbers pulse
['cd1','cd2','cd3'].forEach((id,i)=>{
  KIN.add($(id), {t0:2000+i*150, t1:2500+i*150, from:{opacity:0, scale:1.4}, to:{opacity:1, scale:1}, ease:'outBack'});
  // subtle heartbeat pulse for the minutes tick
  if (id==='cd3') KIN.fx($(id), 2500, 8000, (p,t)=>{
    if (t < 2500) return;
    const beat = Math.sin((t-2500)/1000 * Math.PI * 2);
    const s = 1 + Math.max(0, beat) * 0.06;
    $(id).style.transform = `scale(${s})`;
  });
});
KIT.drift($('cam'), 0, 8000, 1, 1.03);
brandmark(5500, 8000);
KIN.seek(0);
</script></body></html>
