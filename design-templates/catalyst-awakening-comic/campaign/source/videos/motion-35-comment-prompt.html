<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../pipeline/base.css"><link rel="stylesheet" href="../pipeline/motion.css">
<style>
  body { background: #06060d; }
  .title { position: absolute; top: 380px; left: 0; right: 0; text-align: center; font-family: 'Bebas Neue'; font-size: 130px; color: var(--bone); line-height: 0.9; }
  .names { position: absolute; top: 720px; left: 0; right: 0; display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; padding: 0 80px; }
  .chip { padding: 16px 30px; border: 3px solid; border-radius: 999px; font-family: 'Oswald'; font-weight: 700; font-size: 32px; letter-spacing: 4px; }
  .cta { position: absolute; bottom: 300px; left: 0; right: 0; text-align: center; font-family: 'Oswald'; font-weight: 700; font-size: 34px; letter-spacing: 8px; color: var(--gold); }
</style></head><body><div class="stage" id="cam">
  <div class="corner-tl"></div><div class="corner-tr"></div><div class="corner-bl"></div><div class="corner-br"></div>
  <div class="title" id="title">WHO'S YOUR<br>FAVORITE?</div>
  <div class="names" id="names">
    <span class="chip" style="border-color:var(--gold);color:var(--gold)" id="c1">BAYO</span>
    <span class="chip" style="border-color:var(--teal);color:var(--teal)" id="c2">AMARA</span>
    <span class="chip" style="border-color:var(--orange);color:var(--orange)" id="c3">IKENNA</span>
    <span class="chip" style="border-color:var(--red);color:var(--red)" id="c4">ZARA</span>
  </div>
  <div class="cta" id="cta">DROP THEIR NAME BELOW ↓</div>
  <div class="brandmark">CATALYST · <b>THE AWAKENING</b><div class="sitemark">CATALYST-AWAKENING.NETLIFY.APP</div></div>
  <div class="grain"></div><div class="vignette"></div>
</div>
<script src="../pipeline/kinetic.js"></script><script src="../pipeline/kit.js"></script><script src="../pipeline/motion-common.js"></script>
<script>
const $ = id => document.getElementById(id);
cornerFrame(150, 700);
KIT.linePop($('title'), 200, 260, 460);
['c1','c2','c3','c4'].forEach((id,i)=>{
  const t = 1600 + i*180;
  KIN.add($(id), {t0:t, t1:t+340, from:{opacity:0, scale:0.5}, to:{opacity:1, scale:1}, ease:'outBack'});
});
KIN.add($('cta'), {t0:2800, t1:3300, from:{opacity:0, ls:30}, to:{opacity:1, ls:8}, ease:'outExpo'});
KIT.drift($('cam'), 0, 7500, 1, 1.02);
brandmark(5300, 7500);
KIN.seek(0);
</script></body></html>
