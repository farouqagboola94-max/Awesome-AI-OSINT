<text x="540" y="700" font-family="Crimson Pro, Georgia, serif" font-style="italic" font-size="72" fill="#F0EDE5" text-anchor="middle">The city was breathing.</text>
<text x="540" y="800" font-family="Crimson Pro, Georgia, serif" font-style="italic" font-size="72" fill="#F0EDE5" text-anchor="middle">He just learned</text>
<text x="540" y="900" font-family="Crimson Pro, Georgia, serif" font-style="italic" font-size="72" fill="#F0EDE5" text-anchor="middle">how to <tspan fill="#F4B800">listen</tspan>.</text>
