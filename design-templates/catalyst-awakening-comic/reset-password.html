<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Reset your password | Catalystverse</title>
  <link rel="stylesheet" href="/auth/account.css">
</head>
<body><main>
  <a class="brand" href="/">CATALYSTVERSE</a>
  <h1>Set a new password.</h1>
  <p id="authStatus" role="status" aria-live="polite">Verifying your reset link…</p>
  <form id="recoveryForm" data-netlify-ignore="true">
    <label for="newPassword">New password</label>
    <input id="newPassword" name="password" type="password" minlength="8" autocomplete="new-password" required>
    <label for="confirmPassword">Confirm password</label>
    <input id="confirmPassword" name="confirmation" type="password" minlength="8" autocomplete="new-password" required>
    <button id="savePassword" disabled>Save new password</button>
  </form>
  <a href="/">Back to the reader</a>
</main>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script defer src="/reader-account.js"></script>
<script defer src="/auth/reset-password.js"></script>
</body></html>
