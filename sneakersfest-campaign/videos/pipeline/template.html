<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1920px; background:#000; overflow:hidden; }
#stage { position:relative; width:1080px; height:1920px; overflow:hidden; background:#14141A; }
.layer { position:absolute; inset:0; display:none; }
.center { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.disp { font-family:'Bebas'; color:#F4F1EA; line-height:0.98; }
.acc  { font-family:'Hanken'; font-weight:900; font-style:italic; }
#flash { position:absolute; inset:0; background:#FFF; opacity:0; display:block; pointer-events:none; z-index:50; }
.mline { position:absolute; height:22px; border-radius:11px; background:rgba(255,255,255,0.16); }
#watermark { position:absolute; top:52px; left:0; right:0; text-align:center; font-family:'Hanken'; font-weight:900; font-style:italic; font-size:30px; letter-spacing:6px; color:rgba(255,255,255,0.55); display:block; z-index:40; }
</style>
</head>
<body>
<div id="stage">
  <div id="watermark">@SNEAKERSFEST</div>

  <div id="p0" class="layer center">
    <div id="p0word" class="disp" style="font-size:300px;"></div>
  </div>

  <div id="p1" class="layer center" style="padding:0 70px;">
    <div class="mline" id="ml1" style="top:420px; left:-600px; width:420px;"></div>
    <div class="mline" id="ml2" style="top:1500px; left:-800px; width:560px;"></div>
    <div id="hook" class="disp" style="font-size:150px;"></div>
  </div>

  <div id="p2" class="layer center" style="padding:0 80px; background:#14141A;">
    <div id="beat1" class="disp" style="font-size:130px;"></div>
    <div id="b1bar" style="width:220px; height:16px; border-radius:8px; margin-top:56px; background:#FF4D00;"></div>
  </div>

  <div id="p3" class="layer center" style="padding:0 80px; background:#F4F1EA;">
    <div id="beat2" class="disp" style="font-size:130px; color:#14141A;"></div>
    <div id="b2wipe" style="height:20px; border-radius:10px; margin-top:56px; background:#FF4D00; width:0px;"></div>
  </div>

  <div id="p4" class="layer center" style="background:#14141A;">
    <svg id="lace" width="560" height="320" viewBox="0 0 300 170" style="overflow:visible;">
      <path id="lacepath" d="M40 120 C 40 40, 140 40, 150 85 C 160 130, 260 130, 260 55" fill="none" stroke="#FF4D00" stroke-width="18" stroke-linecap="round"/>
      <rect id="agA" x="24" y="108" width="30" height="20" rx="9" fill="#D8FF3D"/>
      <rect id="agB" x="246" y="42" width="30" height="20" rx="9" fill="#D8FF3D"/>
    </svg>
    <div id="wordmark" class="disp" style="font-size:170px; margin-top:40px;">SNEAKERS<span style="color:#FF4D00;">FEST</span></div>
    <svg id="tread" width="1400" height="80" viewBox="0 0 1400 80" style="position:absolute; bottom:180px; left:0;">
      <path d="M0 20 L50 60 L100 20 L150 60 L200 20 L250 60 L300 20 L350 60 L400 20 L450 60 L500 20 L550 60 L600 20 L650 60 L700 20 L750 60 L800 20 L850 60 L900 20 L950 60 L1000 20 L1050 60 L1100 20 L1150 60 L1200 20 L1250 60 L1300 20 L1350 60 L1400 20" fill="none" stroke="#D8FF3D" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div id="p5" class="layer center" style="padding:0 90px;">
    <div id="ctachip" class="acc" style="font-size:66px; padding:38px 64px; border-radius:28px; background:#14141A; color:#F4F1EA;"></div>
    <div id="signoff" class="acc" style="font-size:52px; margin-top:70px;">SEE YOU ON THE FLOOR.</div>
    <div class="disp" id="handle" style="font-size:60px; margin-top:26px; opacity:0.85;">@SNEAKERSFEST</div>
  </div>

  <div id="flash"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const clamp = (x,a,b) => Math.max(a, Math.min(b,x));
const outExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10*x);
const outBack = x => { const c=1.70158, d=c+1; return 1 + d*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
let SPEC = null;
const LACELEN = 400;

window.setupSpec = function(spec) {
  SPEC = spec;
  $('p0word').textContent = spec.slamWord;
  $('hook').innerHTML = spec.hook.join('<br>');
  $('beat1').innerHTML = spec.beat1;
  $('beat2').innerHTML = spec.beat2;
  $('ctachip').textContent = spec.cta;
  // accent theming
  const acc = spec.accent, dark = spec.accentDark;
  $('p1').style.background = acc;
  $('hook').style.color = dark ? '#F4F1EA' : '#14141A';
  $('p5').style.background = acc;
  $('signoff').style.color = dark ? '#F4F1EA' : '#14141A';
  $('handle').style.color = dark ? '#F4F1EA' : '#14141A';
  $('b1bar').style.background = acc;
  $('b2wipe').style.background = acc === '#F4F1EA' ? '#FF4D00' : acc;
  const lp = $('lacepath');
  lp.style.strokeDasharray = LACELEN;
  document.title = 'ready';
};

function show(id) {
  for (const p of ['p0','p1','p2','p3','p4','p5']) $(p).style.display = 'none';
  $(id).style.display = 'flex';
}
const jitter = (t,f,amp) => Math.sin(t*f*6.28318)*amp;

window.seek = function(t) {
  let flash = 0;
  if (t < 0.5) {
    show('p0');
    const k = outExpo(clamp(t/0.35,0,1));
    const s = 3.2 - 2.2*k;
    const rot = (1-k)*-8;
    $('p0word').style.transform = `scale(${s}) rotate(${rot}deg)`;
    $('p0word').style.opacity = clamp(t/0.08,0,1);
    if (t > 0.40 && t < 0.50) flash = 1 - (t-0.40)/0.10;
  } else if (t < 2.2) {
    show('p1');
    const u = (t-0.5)/1.7;
    const k = outBack(clamp(u*2.2,0,1));
    const shake = u < 0.25 ? jitter(t,9,(0.25-u)*34) : 0;
    $('hook').style.transform = `scale(${0.9+0.1*k+u*0.05}) translate(${shake}px,0)`;
    $('hook').style.opacity = 1;
    $('ml1').style.left = (-600 + u*2400) + 'px';
    $('ml2').style.left = (-800 + u*2900) + 'px';
    if (t > 0.5 && t < 0.56) flash = 1 - (t-0.5)/0.06;
  } else if (t < 3.6) {
    show('p2');
    const u = (t-2.2)/1.4;
    const k = outExpo(clamp(u*1.8,0,1));
    $('beat1').style.transform = `translate(0,${(1-k)*140}px)`;
    $('beat1').style.opacity = k;
    $('b1bar').style.width = (60 + 400*outExpo(clamp((u-0.15)*1.6,0,1))) + 'px';
  } else if (t < 5.0) {
    show('p3');
    const u = (t-3.6)/1.4;
    const k = outExpo(clamp(u*1.8,0,1));
    $('beat2').style.transform = `translate(0,${(1-k)*-120}px)`;
    $('beat2').style.opacity = k;
    $('b2wipe').style.width = (860*outExpo(clamp((u-0.1)*1.5,0,1))) + 'px';
  } else if (t < 6.5) {
    show('p4');
    const u = (t-5.0)/1.5;
    const draw = outExpo(clamp(u*1.6,0,1));
    $('lacepath').style.strokeDashoffset = LACELEN*(1-draw);
    $('agA').style.opacity = draw > 0.05 ? 1 : 0;
    $('agB').style.opacity = draw > 0.9 ? 1 : 0;
    const wk = outBack(clamp((u-0.25)*1.9,0,1));
    $('wordmark').style.transform = `scale(${0.6+0.4*wk})`;
    $('wordmark').style.opacity = clamp((u-0.25)*4,0,1);
    $('tread').style.transform = `translate(${-320 + u*320}px,0)`;
    if (t > 5.0 && t < 5.06) flash = 1 - (t-5.0)/0.06;
  } else {
    show('p5');
    const u = (t-6.5)/1.5;
    const k = outBack(clamp(u*2.4,0,1));
    $('ctachip').style.transform = `scale(${k})`;
    $('signoff').style.opacity = clamp((u-0.25)*4,0,1);
    $('handle').style.opacity = clamp((u-0.4)*4,0,1) * 0.85;
    const pulse = u > 0.85 ? 1 + (u-0.85)*0.5 : 1;
    $('p5').style.transform = `scale(${pulse})`;
    if (u > 0.97) flash = (u-0.97)*8;
  }
  $('flash').style.opacity = clamp(flash,0,1)*0.9;
  return true;
};
</script>
</body>
</html>
